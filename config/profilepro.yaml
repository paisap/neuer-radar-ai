  sources:
    active: [hacker_news, github_trending, reddit]
    reddit_subreddits: TODO          # 2-3 concretos
    later: [newsletters, x_accounts, blogs]
  lanes:                             # (proposed) suman 1.0
    career_core:
      weight: 0.50
      topics: [langgraph, ai_agents, llmops, aws_ai, platform_engineering, mcp, infra_and_servers, deployment]
      bias: tecnologias_con_traccion_real
    money_experiments:
      weight: 0.15
      topics: [monetizacion_con_ia, side_projects_rentables]
      requires_evidence: true        # ingresos verificables, caso real o código funcional
    market_arbitrage:
      weight: 0.15
      topics: [productos_probados_adaptables_a_colombia]
