[project]
name = "neuer-radar-ai"
version = "0.1.0"
description = "Personal AI radar for AI, DevOps, cloud, agents, and remote work signals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Santiago Aldana" }]
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[project.scripts]
neuer-radar = "neuer_radar.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuer_radar"]
